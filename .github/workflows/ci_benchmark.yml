name: '🎖️ CI — Benchmark'

on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        benchmark:
          # - yaml
          - js-yaml
    name: Compare — ${{ matrix.benchmark }}
    steps:
      - name: ➕ Actions - Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: ➕ Actions - Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          check-latest: true
          node-version: lts/*

      - name: ➕ Actions — Setup Hyperfine
        run: cargo install --locked hyperfine@2.0.0

      - name: ➕ Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-linux-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-linux-

      - name: ➕ Cache dependencies (Benchmark)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-benchmark-${{ hashFiles('benchmark/package-lock.json') }}
          restore-keys: npm-benchmark-

      - name: 📦 Installing Dependencies
        run: |
          npm ci
          npm --prefix benchmark ci

      - name: 🚀 Building yaml.min
        run: npm run build

      - name: 🎖️ Rock it
        run: npm --prefix benchmark run ${{ matrix.benchmark }}
